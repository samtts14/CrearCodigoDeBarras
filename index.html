<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Etiquetas PDF (50x30 mm)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
  <script>
    async function generatePdf() {
      const { PDFDocument, rgb, StandardFonts } = PDFLib;

      // Tamaño de etiqueta: 50 x 30 mm = 141.73 x 85.04 pt
      const etiquetaWidth = 141.73;
      const etiquetaHeight = 85.04;

      // Parámetros obtenidos de la URL
      const params = new URLSearchParams(window.location.search);
      const codigoProducto = params.get('codigo') || '00010001';
      const precioProducto = params.get('precio') || '900000.00';
      const nombreProducto = params.get('nombre') || 'Nombre del Producto';
      const descripcionProducto = params.get('descripcion') || 'Descripción del Producto';

      // Crear nuevo PDF
      const pdfDoc = await PDFDocument.create();
      const page = pdfDoc.addPage([etiquetaWidth, etiquetaHeight]);

      const font = await pdfDoc.embedFont(StandardFonts.Helvetica);

      // Intentar cargar logo
      try {
        const logoBytes = await fetch('LOGO.jpeg').then(res => res.arrayBuffer());
        const logoImage = await pdfDoc.embedJpg(logoBytes);
        // Logo centrado en la parte superior
        page.drawImage(logoImage, {
          x: (etiquetaWidth - 50) / 2,
          y: etiquetaHeight - 25,
          width: 50,
          height: 18
        });
      } catch (error) {
        console.log('Error al cargar el logo:', error);
      }

      // Texto: nombre del producto (debajo del logo)
      page.drawText(nombreProducto, {
        x: 5,
        y: etiquetaHeight - 45,
        size: 8,
        font,
        color: rgb(0, 0, 0),
        maxWidth: etiquetaWidth - 10
      });

      // Descripción del producto
      page.drawText(descripcionProducto, {
        x: 5,
        y: etiquetaHeight - 57,
        size: 4.5,
        font,
        color: rgb(0, 0, 0),
        maxWidth: etiquetaWidth - 10
      });

      // Generar QR
      const qrCodeUrl = `https://quickchart.io/qr?text=${encodeURIComponent(codigoProducto)}&size=150`;
      const qrCodeDataUrl = await fetch(qrCodeUrl).then(res => res.arrayBuffer());
      const qrCodeImage = await pdfDoc.embedPng(qrCodeDataUrl);

      // QR en la parte inferior derecha
      const qrSize = 35;
      page.drawImage(qrCodeImage, {
        x: etiquetaWidth - qrSize - 5,
        y: 8,
        width: qrSize,
        height: qrSize
      });

      // Código debajo del nombre
      page.drawText(codigoProducto, {
        x: 5,
        y: 10,
        size: 8,
        font,
        color: rgb(0, 0, 0),
      });

      // Precio (opcional)
      /*page.drawText(`$${parseFloat(precioProducto).toFixed(2)}`, {
        x: etiquetaWidth - 55,
        y: etiquetaHeight - 15,
        size: 8,
        font,
        color: rgb(0, 0, 0),
      });*/

      // Exportar PDF
      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      window.location.href = url;
    }

    generatePdf();
  </script>
</body>
</html>
